<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token 注意力可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
.header{padding:14px 24px;background:#16213e;border-bottom:1px solid #0f3460;display:flex;align-items:center;gap:12px;flex-shrink:0}
.header h1{font-size:17px;font-weight:600;color:#e94560}
.header .badge{font-size:11px;background:#0f3460;padding:3px 10px;border-radius:12px;color:#a0c4ff}
.input-bar{padding:10px 24px;background:#16213e;border-bottom:1px solid #0f3460;display:flex;gap:10px;flex-shrink:0}
.input-bar textarea{flex:1;background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:8px 14px;color:#e0e0e0;font-size:14px;resize:none;height:42px;font-family:inherit;outline:none;transition:border-color .2s}
.input-bar textarea:focus{border-color:#e94560}
.input-bar button{background:#e94560;color:#fff;border:none;border-radius:8px;padding:0 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;white-space:nowrap}
.input-bar button:hover{background:#c73650}
.input-bar button:disabled{background:#555;cursor:not-allowed}
.param-col{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.param-row{display:flex;align-items:center;gap:6px}
.param-row label{font-size:11px;color:#888;white-space:nowrap;min-width:78px}
.param-row input{width:80px;background:#1a1a2e;border:1px solid #0f3460;border-radius:6px;padding:5px 8px;color:#e0e0e0;font-size:12px;outline:none}
.param-row input:focus{border-color:#e94560}
.main{display:flex;flex:1;overflow:hidden}
.token-area{flex:1;padding:18px 24px;overflow-y:auto}
.token-area .placeholder{color:#555;font-size:14px;margin-top:40px;text-align:center;line-height:1.8}
.section-label{font-size:11px;color:#a0c4ff;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.section-label.prompt-label{margin-top:0}.section-label.response-label{margin-top:14px}
.token-grid{display:flex;flex-wrap:wrap;gap:2px}
.token{padding:3px 5px;border-radius:3px;font-size:13px;font-family:"SF Mono","Fira Code","Menlo",monospace;cursor:pointer;border:2px solid transparent;transition:border-color .15s,background-color .2s;line-height:30px;height:30px;white-space:pre;display:inline-flex;align-items:center}
.token:hover{border-color:#e94560}
.token.selected{outline:2px solid #e94560;outline-offset:1px}
.token.special{color:#e94560;opacity:0.85}
.token.prompt-token{color:#a0c4ff}
.token.response-token{color:#e0e0e0}
.sidebar{width:270px;background:#16213e;border-left:1px solid #0f3460;padding:18px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.sidebar h2{font-size:13px;color:#a0c4ff;text-transform:uppercase;letter-spacing:1px}
.cg{display:flex;flex-direction:column;gap:5px}
.cg label{font-size:11px;color:#888}
.cg select{background:#1a1a2e;border:1px solid #0f3460;border-radius:6px;padding:7px 10px;color:#e0e0e0;font-size:12px;outline:none}
.cg select:focus{border-color:#e94560}
.info-box{background:#1a1a2e;border-radius:8px;padding:10px;font-size:12px;line-height:1.7}
.info-box .tp{font-family:"SF Mono",monospace;background:#0f3460;padding:1px 6px;border-radius:3px;color:#e94560;font-size:11px}
.info-box .st{color:#888}.info-box .st span{color:#e0e0e0}
.legend{margin-top:auto;padding-top:10px;border-top:1px solid #0f3460}
.legend-bar{height:14px;border-radius:3px;background:linear-gradient(to right,rgba(0,220,100,0.05),rgba(0,220,100,1));margin:5px 0}
.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:#888}
.loading-overlay{position:fixed;inset:0;background:rgba(26,26,46,0.85);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px}
.loading-overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid #0f3460;border-top-color:#e94560;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lt{color:#a0c4ff;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <h1>🔍 Token 注意力可视化</h1>
  <span class="badge" id="modelBadge">加载中...</span>
</div>

<div class="input-bar">
  <textarea id="promptInput">你好，请介绍一下你自己。</textarea>
  <div class="param-col">
    <div class="param-row"><label for="mtThink">Max Thinking</label><input id="mtThink" type="number" value="4096" min="0" max="8192" step="256"></div>
    <div class="param-row"><label for="mtTok">Max Tokens</label><input id="mtTok" type="number" value="4096" min="1" max="16384" step="256"></div>
  </div>
  <button id="genBtn" onclick="generate()">生成</button>
</div>

<div class="main">
  <div class="token-area" id="tokenArea">
    <div class="placeholder" id="placeholder">在上方输入 prompt 并点击「生成」<br>将显示所有 token（含特殊 token）并可视化注意力分布</div>
  </div>

  <div class="sidebar">
    <h2>控制面板</h2>
    <div class="cg">
      <label>Transformer 层级</label>
      <select id="layerSel" disabled><option value="">请先生成</option></select>
    </div>
    <div class="cg">
      <label>注意力头</label>
      <select id="headSel" disabled><option value="">请先生成</option></select>
    </div>
    <div class="info-box" id="infoBox">点击左侧任意 token 查看其注意力分布</div>
    <div class="legend">
      <div style="font-size:11px;color:#888;margin-bottom:3px">注意力强度</div>
      <div class="legend-bar"></div>
      <div class="legend-labels"><span>低</span><span>高</span></div>
    </div>
  </div>
</div>

<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="lt" id="loadingText">正在生成文本并提取注意力...</div>
</div>

<script>
const $=id=>document.getElementById(id);
let S={tokens:[],promptLength:0,numLayers:0,numHeads:0,attentions:null,selectedIdx:null,selectedLayer:null,selectedHead:-1};

function isSpecial(tok){const t=tok.trim();return t.startsWith('<|')&&t.endsWith('|>');}

async function init(){
  try{const r=await(await fetch('/api/model-info')).json();$('modelBadge').textContent=r.model_name+' | '+r.num_layers+'层 '+r.num_heads+'头';}
  catch(e){$('modelBadge').textContent='Qwen3-0.6B';}
}

async function generate(){
  const p=$('promptInput').value.trim();if(!p)return;
  $('genBtn').disabled=true;$('loading').classList.remove('hidden');$('loadingText').textContent='正在生成文本并提取注意力...';
  try{
    const mt=parseInt($('mtThink').value)||0;
    const mx=parseInt($('mtTok').value)||4096;
    const r=await(await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,max_thinking_tokens:mt,max_tokens:mx})})).json();
    S.tokens=r.tokens;S.promptLength=r.prompt_length;S.numLayers=r.num_layers;S.numHeads=r.num_heads;
    S.attentions=r.attentions;S.selectedIdx=null;S.selectedLayer=0;S.selectedHead=-1;
    renderControls();renderTokens();updateInfo();
  }catch(e){alert('生成失败: '+e.message);}
  finally{$('loading').classList.add('hidden');$('genBtn').disabled=false;}
}

function renderControls(){
  const ls=$('layerSel');ls.innerHTML='';ls.disabled=false;
  for(let i=0;i<S.numLayers;i++){const o=document.createElement('option');o.value=i;o.textContent='第 '+i+' 层';ls.appendChild(o);}
  ls.value='0';

  const hs=$('headSel');hs.innerHTML='';hs.disabled=false;
  const ao=document.createElement('option');ao.value=-1;ao.textContent='所有头 (平均)';hs.appendChild(ao);
  for(let i=0;i<S.numHeads;i++){const o=document.createElement('option');o.value=i;o.textContent='Head '+i;hs.appendChild(o);}
  hs.value='-1';

  ls.onchange=()=>{S.selectedLayer=parseInt(ls.value);fetchAndApply();};
  hs.onchange=()=>{S.selectedHead=parseInt(hs.value);fetchAndApply();};
}

async function fetchAndApply(){
  if(S.selectedIdx===null||S.selectedLayer===null)return;
  if(S.selectedHead===-1){
    applyAttention(S.attentions?S.attentions[S.selectedLayer]:null);
  }else{
    try{
      const r=await(await fetch('/api/attention-head?layer='+S.selectedLayer+'&head='+S.selectedHead)).json();
      applyAttention(r.attention);
    }catch(e){console.error(e);}
  }
  updateInfo();
}

function renderTokens(){
  const area=$('tokenArea');$('placeholder')?.remove();area.innerHTML='';
  const pl=document.createElement('div');pl.className='section-label prompt-label';pl.textContent='PROMPT';area.appendChild(pl);
  const pg=document.createElement('div');pg.className='token-grid';area.appendChild(pg);
  const rl=document.createElement('div');rl.className='section-label response-label';rl.textContent='RESPONSE';area.appendChild(rl);
  const rg=document.createElement('div');rg.className='token-grid';area.appendChild(rg);

  S.tokens.forEach((tok,i)=>{
    const sp=document.createElement('span');
    const special=isSpecial(tok);
    sp.className='token '+(i<S.promptLength?'prompt-token':'response-token')+(special?' special':'');
    sp.textContent=tok;sp.dataset.idx=i;
    sp.onclick=()=>selectToken(i);
    (i<S.promptLength?pg:rg).appendChild(sp);
  });
}

function selectToken(idx){
  S.selectedIdx=idx;
  document.querySelectorAll('.token').forEach(el=>el.classList.remove('selected'));
  const el=document.querySelector('.token[data-idx="'+idx+'"]');
  if(el)el.classList.add('selected');
  fetchAndApply();
}

function applyAttention(attn){
  document.querySelectorAll('.token').forEach(el=>el.style.backgroundColor='');
  if(S.selectedIdx===null||S.selectedLayer===null||!attn)return;
  const src=S.selectedIdx;if(src>=attn.length)return;
  const row=attn[src];if(!row)return;
  const vals=row.slice(0,src+1);if(!vals.length)return;
  const mx=Math.max(...vals,1e-10);
  document.querySelectorAll('.token').forEach(el=>{
    const ti=parseInt(el.dataset.idx);
    if(ti<=src&&ti<row.length){
      const score=row[ti]/mx;
      el.style.backgroundColor='rgba(0,220,100,'+Math.max(score*0.85,0.03)+')';
    }
  });
}

function updateInfo(){
  const box=$('infoBox');
  if(S.selectedIdx===null){box.innerHTML='点击左侧任意 token 查看其注意力分布';return;}
  const tok=S.tokens[S.selectedIdx];const layer=S.selectedLayer!==null?S.selectedLayer:'?';
  const head=S.selectedHead===-1?'平均':('Head '+S.selectedHead);
  let topK='';
  const attn=S.attentions?S.attentions[layer]:null;
  if(attn&&S.selectedIdx<attn.length){
    const row=attn[S.selectedIdx];
    const indexed=row.map((v,i)=>[v,i]).filter(([_,i])=>i<S.selectedIdx);
    indexed.sort((a,b)=>b[0]-a[0]);
    topK=indexed.slice(0,5).map(([v,i])=>'<div class="st"><span class="tp">'+esc(S.tokens[i])+'</span> '+v.toFixed(4)+'</div>').join('');
  }
  box.innerHTML='<div style="margin-bottom:6px">选中: <span class="tp">'+esc(tok)+'</span></div>'
    +'<div class="st">位置: <span>'+S.selectedIdx+'</span> | 层: <span>'+layer+'</span> | 头: <span>'+head+'</span></div>'
    +(topK?'<div style="margin-top:6px;font-size:11px;color:#888">Top-5 注意力目标:</div>'+topK:'');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
init();
</script>
</body>
</html>
